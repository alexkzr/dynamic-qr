      if(p===0 && a>0){
        const minor = a<SMALL;
        list.push({node:x,k, minor, kind:'Количество 0', cls: minor?'k-mute':'k-warn', text:`${cap(M[k].fact)} ${a}, а ${qty(k)} — 0`});
      }
      if(!x.children.length && p>0 && x.m[k].every(([aa])=>aa===0)) list.push({node:x,k, minor: p<SMALL, kind:'Не заполняют', cls: p<SMALL?'k-mute':'k-warn', text:`${cap(qty(k))} ${p}, но ${M[k].fact} — 0 во всех кварталах. Вероятно, эту графу не заполняют`});
      if(k==='att' && i>0 && !isOpened(x,i) && !moves(i).get(x)){ const a0 = x.m.att[i-1][0], dA = a-a0; if(a0>0 && p>0 && Math.abs(dA)>=10 && Math.abs(dA)/a0>=0.2) list.push({node:x,k, kind:'Посещаемость', cls:'k-warn', checkOnly:true, text:`пришли ${dA>0?'на':'на'} ${Math.abs(dA)} ${dA>0?'больше':'меньше'} (${dA>0?'+':'−'}${Math.round(Math.abs(dA)/a0*100)}%)` + (i>=4 && x.m.att[i-4][1]>0 ? `; год назад, ${qLabel(QN[i-4])}: ${x.m.att[i-4][0]} из ${x.m.att[i-4][1]}` : '')}); }  const j = denomJump(x,k,i,i-1);
      if(j!=null && p===0) list.push({node:x,k, kind:'Не сдали', cls:'k-warn', text:`за этот квартал данных нет (в прошлом квартале ${qty(k)} было ${x.m[k][i-1][1]})`});
      else if(j!=null && !(j<0 && cleanupNote(x,i)) && !(k==='att' && moves(i).get(x)?.role==='from')) list.push({node:x,k, kind:'Количество', cls:'k-warn', text: listJumpText(x,k,i)});
    });
  });
  // из Excel (за все кварталы, сгруппировано)
  const g = {};
  DATA.excelFlags.filter(f=>ids.has(f.node) && f.kind!=='empty').forEach(f=>{
    const key = f.node+'|'+f.metric+'|'+f.kind;
    (g[key] ||= {node:NODES[f.node], k:f.metric, kind: f.kind==='formula'?'Формула':'Итог', sheet:f.sheet, cells:[], qs:[], last:f.text}).qs.push(f.q);
    if(f.cell) g[key].cells.push(f.cell);
    g[key].last = f.text;
  });
  Object.values(g).forEach(x=>{
    const when = x.qs.length===QN.length ? 'во всех кварталах' : x.qs.map(qLabel).join(', ');
    if(x.kind==='Итог') list.push({node:x.node, k:x.k, kind:x.kind, cls:'k-mute', excelGroup:true, text:`итог листа в Excel не равен сумме подразделений: ${when}. Пример: ${x.last}`});
    else excel.push({node:x.node, k:x.k, kind:'Формула', cls:'k-mute', excel:true,
      text:`лист «${x.sheet}», ячейки ${x.cells.join(', ')}. Пример: ${x.last}`});
  });
  excel.forEach(x=>{ x.excelGroup = true; list.push(x); });
  // Есть твоё пояснение к подразделению за этот квартал → догадки скрипта («вероятно…», «возможно…», скачки количества)
  // по нему не нужны: показываем только пояснение. Настоящие аномалии (>100%, не заполняют, не сдали) остаются.
  if(raw) return list; const GUESS = new Set(['Аудит карточек?','Перевод?','Открыт','Закрыт?','Количество']);
  const noted = new Set(NOTES.filter(x=>x.q===QN[i]).map(x=>x.node));
  // мелкие отклонения (превышение на 1–2 человека, маленькие группы) не публикуем вовсе
  const out = list.filter(x=>!x.minor && !x.checkOnly && !(noted.has(x.node.id) && GUESS.has(x.kind)));
  noted.forEach(id=>{ if(ids.has(id) && !out.some(x=>x.node.id===id && !x.excelGroup && !x.minor)) out.push({node:NODES[id], noteOnly:true}); });
  return out;
}


/* ---------- пояснения из листа «Пояснения» ---------- */
const NOTES = (DATA.notes||[]);
function notesFor(n){
  const i = state.q, ids = new Set(subtree(n).map(x=>x.id));
  // на странице региона пояснения приходов/кол/миссий видны, только если в столбце «В регион» стоит «да»
  const mine = NOTES.filter(x=>ids.has(x.node) && (n.parent || x.node==='area' || x.region));
  const qi = x => QN.indexOf(x.q);
  return {
    now:  mine.filter(x=>x.q===QN[i]),
    year: mine.filter(x=>x.q && qi(x)<i && qi(x)>=i-3).sort((a,b)=>qi(b)-qi(a)),   // влияют на сравнение «за год»
    always: mine.filter(x=>!x.q),
  };
}
function noteItem(n, x, withQ){
  const p = el('div','note-i');
  const node = NODES[x.node];
  if(node!==n){ const w = el('span','who'); const a = el('a',null,nm(node)); a.href='#'; a.addEventListener('click',e=>{e.preventDefault(); go({node:node.id});}); w.append(a); p.append(w, document.createTextNode(' · ')); }
  if(withQ) p.append(el('span','met', qLabel(x.q)+' · '));
  if(x.metric && M[x.metric]) p.append(el('span','met', M[x.metric].short+': '));
  p.append(document.createTextNode(x.text));
  return p;
}
function notesPanel(n){
  const g = notesFor(n), total = g.now.length+g.year.length+g.always.length;
  if(!total) return null;
  const d = document.createElement('details'); d.className='notes'; d.open = true;
  const s = el('summary',null,loc('notes')); s.append(el('span','cnt',String(total))); d.append(s);
  const b = el('div','dbody');
  if(g.now.length){ b.append(el('div','note-g', qLabel(QN[state.q]))); g.now.forEach(x=>b.append(noteItem(n,x,false))); }
  if(g.year.length){ b.append(el('div','note-g',loc('notesEarlier'))); g.year.forEach(x=>b.append(noteItem(n,x,true))); }
  if(g.always.length){ b.append(el('div','note-g',loc('notesGeneral'))); g.always.forEach(x=>b.append(noteItem(n,x,false))); }
  d.append(b); return d;
}
/* ---------- сравнение подразделений: горизонтальные столбики ----------
   Две сортировки: по проценту и по количеству пришедших.
   По проценту честный рейтинг только у групп от 10 человек; маленькие группы идут после,
   а «пришло больше, чем в списках» — отдельной группой внизу (столбик обрезан на 100%, штриховка). */
let CMP_SORT = 'pct';
let CMP_SOLO = false; // режим беседы: только текущее подразделение (без изменения исходных данных)
function barChart(host, n, k, hl){
  host.replaceChildren();
  const EN = LANG==='en', i = state.q;
  const src = FLAT(n) ? n.children.flatMap(c=>c.type==='округ' ? c.children : [c]) : n.children;   // миссия: все приходы, включая приходы округов
  const solo = !!hl && !hl.children.length && CMP_SOLO;
  const rows = src.filter(c=>!c.empty && (!solo || c.id===hl.id)).map(c=>({c, v:val(c,k,i), ap:ap(c,k,i)}));
  const withV = rows.filter(r=>r.v!=null), noV = rows.filter(r=>r.v==null);
  const over = r => r.ap[0] > r.ap[1];   // пришло больше, чем в списке — любое превышение
  const small = r => r.ap[1] < SMALL;
  const byN = CMP_SORT==='n';
  // группы: [заголовок или null, строки]
  let groups;
  if(byN) groups = [[null, withV.slice().sort((a,b)=>b.ap[0]-a.ap[0] || b.v-a.v)]];
  else {
    const pctSort = (a,b)=>b.v-a.v || b.ap[1]-a.ap[1];
    groups = [
      [null, withV.filter(r=>!over(r) && !small(r)).sort(pctSort)],
      [EN ? `Fewer than ${SMALL} people on record — percentage is unstable` : `Меньше ${SMALL} человек в списке — процент неустойчив`, withV.filter(r=>!over(r) && small(r)).sort(pctSort)],
      [EN ? 'More attended than on record — check the data' : 'Пришло больше, чем в списках, — проверить данные', withV.filter(over).sort(pctSort)],
    ].filter(g=>g[1].length);
    if(!groups.length || groups[0][0]) groups.unshift([null, []]);
  }

  // переключатель сортировки
  const bar = el('div','sortbar');
  [['pct', EN?'by %':'по проценту'], ['n', EN?'by number attended':'по количеству пришедших']].forEach(([key, lbl])=>{
    const b = el('button', null, lbl); b.type = 'button'; b.setAttribute('aria-pressed', CMP_SORT===key);
    b.addEventListener('click', ()=>{ if(CMP_SORT===key) return; CMP_SORT = key; hideTip(); barChart(host, n, k, hl); });
    bar.append(b);
  });
  if(hl && !hl.children.length){
    const toggle = el('button', null, CMP_SOLO ? (EN?'Show all':'Показать все') : (EN?'Hide others':'Скрыть остальные'));
    toggle.type = 'button'; toggle.className = 'cmp-privacy';
    toggle.setAttribute('aria-pressed', String(CMP_SOLO));
    toggle.addEventListener('click', ()=>{ CMP_SOLO = !CMP_SOLO; hideTip(); render(); });
    bar.append(toggle);
  }
  host.append(bar);

  const pv = val(n,k,i);
  const W = Math.max(280, host.clientWidth);
  const narrow = W < 520;
  const labelW = narrow ? 0 : Math.min(270, W*0.4);
  const label = r => byN ? `${nf.format(r.ap[0])}` : pct(r.v);
  const peopleTxt = r => byN ? ` · ${pct(r.v)} ${loc('of')} ${nf.format(r.ap[1])}` : ` · ${nf.format(r.ap[0])} ${loc('of')} ${nf.format(r.ap[1])}`;
  _ctx.font = `400 13.5px ${getComputedStyle(document.body).fontFamily}`;
  const R = 12 + Math.max(40, ...withV.map(r=>_ctx.measureText(label(r)+peopleTxt(r)).width));
  const rowH = narrow ? 50 : 32, T = 8, B = 8, GH = 30;
  const nRows = groups.reduce((s,g)=>s+g[1].length,0), nHead = groups.filter(g=>g[0]).length;
  const showAvg = !solo && !byN && pv!=null;
  const H = T + B + nRows*rowH + nHead*GH + (showAvg?18:0);
  const ranked = groups[0][1];
  const max = byN ? Math.max(1, ...withV.map(r=>r.ap[0])) : niceMax(Math.max(0.05, pv||0, ...ranked.map(r=>r.v), ...withV.filter(r=>!over(r)).map(r=>r.v)));
  const x0 = narrow ? 0 : labelW + 8;
  const x = v => x0 + Math.min(v, max)/max*(W - x0 - R);
  const svg = S('svg',{width:W,height:H,viewBox:`0 0 ${W} ${H}`,role:'img','aria-label':`${M[k].name}: ${EN?'comparison':'сравнение'}, ${qLabel(QN[i])}`});
  const pat = S('pattern',{id:'hatch-over',width:6,height:6,patternUnits:'userSpaceOnUse',patternTransform:'rotate(45)'}, S('defs',{},svg));
  S('rect',{width:6,height:6,fill:'var(--surface)'},pat); S('line',{x1:0,y1:0,x2:0,y2:6,stroke:'var(--s1)','stroke-width':3,opacity:.9},pat);
  const gridTop = T + (showAvg?18:0);
  if(!byN) [0,.25,.5,.75,1].filter(v=>v<=max+1e-9).forEach(v=>{
    S('line',{x1:x(v),x2:x(v),y1:gridTop-4,y2:H-B,stroke: v===0?'var(--axis)':'var(--grid)','stroke-width':1},svg);
  });
  else S('line',{x1:x0,x2:x0,y1:gridTop-4,y2:H-B,stroke:'var(--axis)','stroke-width':1},svg);

  let y = gridTop, j = 0;
  groups.forEach(([title, list])=>{
    if(title){
      S('line',{x1:0,x2:W,y1:y+6,y2:y+6,stroke:'var(--grid)','stroke-width':1},svg);
      const t = S('text',{x:0, y:y+22, class:'axis-t grp-t'},svg); t.textContent = title;
      y += GH;
    }
    list.forEach(r=>{
      const top = y; y += rowH; j++;
      const isOver = over(r), isSmall = small(r);
      const g = S('g',{class:'bar-hit',tabindex:0,role:'button','aria-label':`${nm(r.c)}: ${pct(r.v)}, ${r.ap[0]} ${loc('of')} ${r.ap[1]}`},svg);
      if(hl===r.c) S('rect',{x:0,y:top,width:W,height:rowH,fill:'var(--surface-2)',rx:6},g);
      S('rect',{class:'bar-bg',x:0,y:top,width:W,height:rowH,fill:'transparent',rx:6},g);
      const barY = narrow ? top+24 : top+8, bh = 16;
      const col = n.parent ? 'var(--s1)' : accOf(r.c);
      if(!n.parent){ S('circle',{cx: narrow ? 5 : Math.max(6, labelW - 6 - _ctx.measureText(fit(nm(r.c), labelW-22, true)).width - 10), cy: narrow ? top+12 : top+16, r:5, fill:accOf(r.c)},g); }
      const t = narrow ? S('text',{x:n.parent?0:16,y:top+17,class:'bar-label'},g) : S('text',{x:labelW,y:top+21,'text-anchor':'end',class:'bar-label'},g);
      t.textContent = fit(nm(r.c), narrow ? W-20 : labelW-(n.parent?6:22), r.c.type!=='приход');
      if(r.c.type!=='приход' || hl===r.c) t.setAttribute('font-weight', hl===r.c?'700':'650');
      if(isSmall || (isOver && !byN)) t.style.fill = 'var(--muted)';
      const len = byN ? r.ap[0] : (isOver ? 1 : r.v);
      const bw = Math.max(2, x(len)-x0);
      const op = hl ? (r.c===hl ? 1 : (isSmall ? .25 : .5)) : (isSmall ? .4 : 1);
      S('rect',{x:x0,y:barY,width:bw,height:bh,rx:4,fill: isOver && !byN ? 'url(#hatch-over)' : col, stroke: isOver && !byN ? col : 'none', 'stroke-width':1, opacity: op, class:'gbar', style:`--i:${j}`},g);
      const vt = S('text',{x:x0+bw+6,y:barY+13,class:'bar-val gfade',style:'paint-order:stroke;stroke:var(--surface);stroke-width:5px;stroke-linejoin:round'},g);
      const t1 = S('tspan',{style:'fill:var(--ink)'},vt); t1.textContent = label(r);
      const t2 = S('tspan',{style:'fill:var(--muted)'},vt); t2.textContent = peopleTxt(r);
      const enter = ev => showTip(ev, tp=>{
        tp.append(el('div','tt',`${nm(r.c)} (${typeName(r.c).toLowerCase()}) · ${qLabel(QN[i])}`));
        tipRow(tp, col, pct(r.v), M[k].short, `${nf.format(r.ap[0])} ${loc('of')} ${nf.format(r.ap[1])} ${baseOf(k)}`);
        const pv0 = val(r.c,k,i-1); if(pv0!=null) tp.append(el('div','tsub', `${loc('prevQ')}: ${pct(pv0)}`));
        if(isOver) tp.append(el('div','tsub', EN ? `⚠ over 100%: more attended than on record` : `⚠ больше 100% — ${M[k].fact} больше, чем ${qty(k)}`));
        if(isSmall) tp.append(el('div','tsub',loc('lt10')));
        if(r.c.children.length || hl) tp.append(el('div','tsub',loc('clickOpen')));
      });
      g.addEventListener('pointermove', enter); g.addEventListener('focus', enter);
      g.addEventListener('pointerleave', hideTip); g.addEventListener('blur', hideTip);
      const open = ()=>{ hideTip(); go({node:r.c.id}); window.scrollTo({top:0}); };
      g.addEventListener('click', open);
      g.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); open(); } });
    });
  });
  // линия родителя — поверх строк
  if(showAvg){
    S('line',{x1:x(pv),x2:x(pv),y1:T+12,y2:H-B,stroke:'var(--ref)','stroke-width':1.5,'pointer-events':'none'},svg);
    const t = S('text',{x:x(pv),y:T+8,'text-anchor': x(pv)>W-120?'end':'middle',class:'axis-t'},svg);
    t.textContent = `${loc('avgShort')} ${pct(pv)}`;
  }
  host.append(svg);
  if(noV.length) host.append(el('p','note', loc('noData') + noV.map(r=>nm(r.c)).join(', ')));
}

/* ---------- графики листа ---------- */
const PAIR = ['var(--s1)','var(--s2)'];
const qMini = q => { const [y,k] = q.split('-'); return LANG==='en' ? `Q${k}-${y}` : `${y}-${k}`; };
const parentOf = n => n.parent || null;      // в файле подразделения родитель — «заглушка» с цифрами уровня выше

/* столбики по кварталам: один или два показателя рядом (пары как на листе президентства) */
function barCard(host, n, keys, o={}){
  host.replaceChildren();
  const N = QN.length, W = Math.max(o.mini?140:260, Math.floor(host.clientWidth)||300), H = o.h || (o.mini?104:200);
  const T = o.mini?16:22, B = o.mini?16:34, L = 2, R = 2;
  const band = (W-L-R)/N, nk = keys.length, gap = nk>1 ? 4 : 0;
  const bw = Math.max(4, Math.min(o.mini?20:(nk>1?24:40), (band*0.76-gap*(nk-1))/nk));
  const ser = keys.map(k=>n.m[k].map(([a,p])=>p>0?a/p:null));
  const par = o.parent && nk===1 && has(o.parent,keys[0]) ? o.parent : null;
  const pv = par ? par.m[keys[0]].map(([a,p])=>p>0?a/p:null) : [];
  const all = ser.flat().concat(pv).filter(v=>v!=null);
  const roomy = band >= (LANG==='en'?30:25);
  const showMini = i => roomy || i===0 || i===N-1 || (N-1-i)%2===0;
  const max = o.max || Math.max(0.05, ...all) * (o.mini?1.28:1.2);
  const y = v => T + (1 - Math.min(v,max)/max)*(H-T-B);
  const cols = o.colors || (nk>1 ? PAIR : ['var(--s1)']);
  const svg = S('svg',{width:W,height:H,viewBox:`0 0 ${W} ${H}`,role:'img','aria-label':o.label||''});
  S('line',{x1:L,x2:W-R,y1:y(0),y2:y(0),stroke:'var(--axis)'},svg);
  QN.forEach((q,i)=>{
    const cx = L+band*(i+.5), cur = i===state.q;
    const g = S('g',{class:o.mini?'':'qhit'},svg);
    if(!o.mini) S('rect',{class:'qbg',x:L+band*i+1,y:0,width:band-2,height:H,fill:'transparent',rx:6},g);
    const x0 = cx - (nk*bw+(nk-1)*gap)/2;
    keys.forEach((k,j)=>{
      const v = ser[j][i]; if(v==null) return;
      const a = n.m[k][i][0], x = x0 + j*(bw+gap), top = y(v), h = Math.max(1.5, y(0)-top);
      const small = n.m[k][i][1] < SMALL;
      S('rect',{x,y:top,width:bw,height:h,rx:Math.min(3,bw/3),fill:cols[j],opacity:small?.3:(cur?1:(o.mini?.7:.72)),class:'gcol',style:`--i:${i}`},g);
      if(!o.mini || showMini(i) || cur){ const lab = S('text',{x:x+bw/2,y:top-5,'text-anchor':'middle',class:'bar-val'+(cur?' cur':'')},g); lab.textContent = pct(v);
      if(o.mini) lab.setAttribute('font-size',10); else if(nk>1) lab.setAttribute('font-size',10); }
      if(o.counts && !o.mini && h>=18 && bw>=15){ const c = S('text',{x:x+bw/2,y:y(0)-6,'text-anchor':'middle',class:'bar-in'},g); c.textContent = nf.format(a); if(String(a).length*6.2>bw) c.setAttribute('font-size',9); }
    });
    if(o.mini){ if(showMini(i) || cur){ const t1 = S('text',{x:cx,y:H-3,'text-anchor':'middle',class:'axis-t'+(cur?' cur':''),'font-size':9.5},g); t1.textContent = qMini(q); } }
    else { const [qa,qb] = qShort(q); S('text',{x:cx,y:H-B+15,'text-anchor':'middle',class:'axis-t'+(cur?' cur':'')},g).textContent = qa; S('text',{x:cx,y:H-B+28,'text-anchor':'middle',class:'axis-t'},g).textContent = qb; }
    if(!o.mini){
      g.addEventListener('pointermove', ev=>showTip(ev, tp=>{
        tp.append(el('div','tt',qLabel(q)));
        keys.forEach((k,j)=>{ const [a,p] = n.m[k][i]; tipRow(tp, cols[j], p>0?pct(a/p):'—', lbl(k,nk), p>0?`${nf.format(a)} ${loc('of')} ${nf.format(p)} ${baseOf(k)}`:loc('nodata2')); if(p>0 && p<SMALL) tp.append(el('div','tsub',loc('lt10'))); });
        if(par){ const [pa,pp] = par.m[keys[0]][i]; tipRow(tp,'var(--ref)', pp>0?pct(pa/pp):'—', `${loc('avgIn')} ${nm(par)}`); }
      }));
      g.addEventListener('pointerleave', hideTip);
      g.addEventListener('click', ev=>{ ev.stopPropagation(); go({q:i}, true); });
    }
  });
  if(par){ let d='', pen=false; pv.forEach((v,i)=>{ if(v==null){pen=false;return;} d += (pen?'L':'M')+(L+band*(i+.5)).toFixed(1)+' '+y(v).toFixed(1); pen=true; });
    S('path',{d,fill:'none',stroke:'var(--ref)','stroke-width':o.mini?1.2:1.6,'stroke-dasharray':'4 3','stroke-linejoin':'round',opacity:.8,'pointer-events':'none'},svg);
    svg.querySelectorAll('.bar-val').forEach(t=>svg.appendChild(t)); }   // подписи поверх пунктира
  host.append(svg);
}

/* люди: сколько пришло — столбик из входящих подразделений, как на листе президентства.
   Цветов много, поэтому каждый кусок подписан числом, а при наведении подсвечивается это подразделение во всех кварталах. */
function kidsOf(n){ return n.children.filter(c=>!c.empty && has(c,'att')); }
// миссия (кроме Московской): на графиках — все приходы, включая приходы её округов
const FLAT = n => n.type==='миссия' && n.id!=='Moscow Mission';
function unitsOf(n){ return FLAT(n) ? kidsOf(n).flatMap(c=>c.type==='округ' ? kidsOf(c) : [c]) : kidsOf(n); }
const SOFT = ['#86B8E2','#EE9A8C','#E8C463','#7E9AD6','#86C496','#B9A2DE','#EAA9C6','#8FCBCB','#D2AE88','#B0BAC6','#D6D27A','#9FD1B4'];
function kidColor(n, c, j){ return !n.parent ? accOf(c) : SOFT[j % SOFT.length]; }
function peopleCard(host, n){
  host.replaceChildren();
  const kids = unitsOf(n), stack = kids.length>=2;
  const N = QN.length, W = Math.max(260, Math.floor(host.clientWidth)||300), T = 22, B = 34, L = 2, R = 2;
  // «резиновая» высота: тянем график, пока самый тонкий слой не станет достаточно высоким для цифры (но не выше 640 px)
  let H = stack ? 270 + Math.max(0,kids.length-6)*14 : 200;
  if(stack){ const mx = Math.max(1,...n.m.att.map(s=>s[0]))*1.1, minA = Math.min(...kids.flatMap(c=>c.m.att.map(s=>s[0])).filter(a=>a>0));
    if(isFinite(minA)) H = Math.min(640, Math.max(H, Math.ceil(T + B + 15*mx/minA))); }
  const band = (W-L-R)/N, bw = Math.min(50, band*0.74);
  const tot = n.m.att.map(s=>s[0]), max = Math.max(1,...tot)*1.1, y = v => T + (1-v/max)*(H-T-B);
  const svg = S('svg',{width:W,height:H,viewBox:`0 0 ${W} ${H}`,role:'img','aria-label':loc('attPeople'),class:'stk'});
  S('line',{x1:L,x2:W-R,y1:y(0),y2:y(0),stroke:'var(--axis)'},svg);
  const light = j => (!n.parent ? UNIT_SLOT.get(kids[j])===3 : false);
  const hl = j => { svg.classList.toggle('hl', j!=null); svg.querySelectorAll('.seg').forEach(e=>e.classList.toggle('on', +e.dataset.c===j)); host.querySelectorAll('.legend span').forEach((e,x)=>e.classList.toggle('on', x===j));
    const mg = document.querySelector('.multi'); if(mg){ mg.classList.toggle('hl', j!=null); mg.querySelectorAll('.mcard').forEach((e,x)=>e.classList.toggle('on', x===j)); } };
  if(stack) window._stackHL = hl;
  QN.forEach((q,i)=>{
    const cx = L+band*(i+.5), cur = i===state.q, g = S('g',{class:'qhit'},svg);
    S('rect',{class:'qbg',x:L+band*i+1,y:0,width:band-2,height:H,fill:'transparent',rx:6},g);
    if(stack){ let acc = 0;
      kids.forEach((c,j)=>{ const [a,p] = c.m.att[i]; if(!a) return; const y1 = y(acc+a), h = y(acc)-y1;
        const sg = S('g',{class:'seg','data-c':j},g);
        S('rect',{x:cx-bw/2,y:y1,width:bw,height:Math.max(.5,h-1.5),fill:kidColor(n,c,j),opacity:cur?1:.85,class:'gcol',style:`--i:${i}`},sg);
        if(h>=13){ const tx = S('text',{x:cx,y:y1+h/2+3.5,'text-anchor':'middle',class:'seg-in'+(light(j)?' dk':'')},sg); tx.textContent = nf.format(a); }
        else { const tx = S('text',{x:cx+bw/2+4,y:y1+h/2+4,class:'seg-out'},sg); tx.textContent = nf.format(a); }   // тонкий слой: цифра сбоку, видна при подсветке
        sg.addEventListener('pointerenter', ()=>hl(j));
        sg.addEventListener('pointermove', ev=>{ ev.stopPropagation(); showTip(ev, tp=>{ tp.append(el('div','tt',`${nm(c)} · ${qLabel(q)}`)); tipRow(tp, kidColor(n,c,j), nf.format(a), loc('peopleTotal')==='total'?'attended':'пришли', p>0?`${pct(a/p)} · ${nf.format(a)} ${loc('of')} ${nf.format(p)}`:null); if(c.children.length || true) tp.append(el('div','tsub',loc('clickOpen'))); }); });
        sg.addEventListener('click', ev=>{ ev.stopPropagation(); hideTip(); go({node:c.id}); window.scrollTo({top:0}); });
        acc += a; });
    } else { const top = y(tot[i]); S('rect',{x:cx-bw/2,y:top,width:bw,height:Math.max(1.5,y(0)-top),rx:3,fill:'var(--s1)',opacity:cur?1:.72,class:'gcol',style:`--i:${i}`},g); }
    const lt = S('text',{x:cx,y:y(tot[i])-6,'text-anchor':'middle',class:'bar-val'+(cur?' cur':'')},g); lt.textContent = nf.format(tot[i]);
    const [qa,qb] = qShort(q); S('text',{x:cx,y:H-B+15,'text-anchor':'middle',class:'axis-t'+(cur?' cur':'')},g).textContent = qa; S('text',{x:cx,y:H-B+28,'text-anchor':'middle',class:'axis-t'},g).textContent = qb;
    g.addEventListener('pointermove', ev=>showTip(ev, tp=>{ tp.append(el('div','tt',qLabel(q))); tipRow(tp, 'var(--ref)', nf.format(tot[i]), loc('peopleTotal')); }));
    g.addEventListener('pointerleave', ()=>{ hideTip(); });
    g.addEventListener('click', ()=>go({q:i}, true));
  });
  svg.addEventListener('pointerleave', ()=>hl(null));
  host.append(svg);
  if(stack){ const lg = el('div','legend stkleg'); kids.forEach((c,j)=>{ const s = el('span'); const sw = el('i'); sw.style.background = kidColor(n,c,j); s.append(sw, document.createTextNode(nm(c)));
      s.addEventListener('pointerenter',()=>hl(j)); s.addEventListener('pointerleave',()=>hl(null)); s.addEventListener('click',()=>{ go({node:c.id}); window.scrollTo({top:0}); }); lg.append(s); }); host.append(lg); }
}

/* люди за процентом: вложенные столбики — светлый столбик = количество, синяя часть внутри = сколько пришло.
   Доля синего и есть процент. */
function factCard(host, n, k){
  host.replaceChildren();
  const N = QN.length, W = Math.max(240, Math.floor(host.clientWidth)||300), H = 200, L = 2, R = 2, T = 22, B = 32;
  const band = (W-L-R)/N, bw = Math.min(44, band*0.68), cx = i => L+band*(i+.5);
  const s = n.m[k], max = Math.max(1,...s.map(x=>Math.max(x[0],x[1])))*1.08, y = v => T + (1-v/max)*(H-T-B);
  const svg = S('svg',{width:W,height:H,viewBox:`0 0 ${W} ${H}`,role:'img','aria-label':LANG==='en'?'Attended and potential':'Пришли и количество'});
  S('line',{x1:L,x2:W-R,y1:y(0),y2:y(0),stroke:'var(--axis)'},svg);
  s.forEach(([a,p],i)=>{
    const cur = i===state.q, g = S('g',{class:'qhit'},svg);
    S('rect',{class:'qbg',x:L+band*i+1,y:0,width:band-2,height:H,fill:'transparent',rx:6},g);
    const tp = y(p), ta = y(a);
    if(a > p && p > 0){
      // пришло больше, чем членов Церкви по записям: до уровня количества — сплошной синий, выше — «перелив», на уровне количества — черта
      S('rect',{x:cx(i)-bw/2,y:ta,width:bw,height:y(0)-ta,rx:3,class:'att-over'+(cur?' cur':''),style:`--i:${i}`},g);
      S('rect',{x:cx(i)-bw/2,y:tp,width:bw,height:Math.max(1.5,y(0)-tp),rx:3,class:'att'+(cur?' cur':''),style:`--i:${i}`},g);
      S('line',{x1:cx(i)-bw/2-3,x2:cx(i)+bw/2+3,y1:tp,y2:tp,class:'pot-line'},g);
      const la = S('text',{x:cx(i),y:ta-5,'text-anchor':'middle',class:'bar-val'+(cur?' cur':'')},g); la.textContent = nf.format(a);
      if(y(0)-tp >= 17){ const lp = S('text',{x:cx(i),y:tp+13,'text-anchor':'middle',class:'att-in'},g); lp.textContent = nf.format(p); }
    } else {
      S('rect',{x:cx(i)-bw/2,y:tp,width:bw,height:Math.max(p?1.5:0,y(0)-tp),rx:3,class:'pot'+(cur?' cur':''),style:`--i:${i}`},g);
      S('rect',{x:cx(i)-bw/2,y:ta,width:bw,height:Math.max(a?1.5:0,y(0)-ta),rx:3,class:'att'+(cur?' cur':''),style:`--i:${i}`},g);
      const lp = S('text',{x:cx(i),y:tp-5,'text-anchor':'middle',class:'bar-val'+(cur?' cur':'')},g); lp.textContent = p ? nf.format(p) : '—';
      const inside = y(0)-ta >= 17;
      const la = S('text',{x:cx(i),y:inside ? ta+13 : ta-4,'text-anchor':'middle',class:inside?'att-in':'att-out'},g); la.textContent = nf.format(a);
      if(!a || (!inside && tp > ta-20)) la.setAttribute('display','none');
    }
    const [qa,qb] = qShort(QN[i]); S('text',{x:cx(i),y:H-B+14,'text-anchor':'middle',class:'axis-t'+(cur?' cur':'')},g).textContent = qa; S('text',{x:cx(i),y:H-B+27,'text-anchor':'middle',class:'axis-t'},g).textContent = qb;
    g.addEventListener('pointermove', ev=>showTip(ev, t=>{ t.append(el('div','tt',qLabel(QN[i])));
      tipRow(t,'var(--s1)', nf.format(a), LANG==='en'?'attended':'пришли', p>0?pct(a/p):null);
      tipRow(t,'var(--pot)', nf.format(p), LANG==='en'?`potential (${baseOf(k)})`:`количество ${baseOf(k)}`);
      if(i>0){ const da = a-s[i-1][0], dp = p-s[i-1][1], f = d => `${d>0?'+':d<0?'−':''}${nf.format(Math.abs(d))}`; t.append(el('div','tsub', `${LANG==='en'?'vs previous quarter':'к прошлому кварталу'}: ${f(da)} / ${f(dp)}`)); } }));
    g.addEventListener('pointerleave', hideTip);
    g.addEventListener('click', ev=>{ ev.stopPropagation(); go({q:i}, true); });
  });
  host.append(svg);
  const lg = el('div','legend'); [['var(--s1)', LANG==='en'?'Attended':'Пришли'], ['var(--pot)', LANG==='en'?'Potential':'Количество']].forEach(([c,tx])=>{ const sp = el('span'), sw = el('i'); sw.style.background = c; sp.append(sw, document.createTextNode(tx)); lg.append(sp); });
  if(s.some(([a,p])=>a>p && p>0)){
    if(s.every(([a,p])=>a>p || !p)) lg.children[1].remove();                     // светлых столбиков нет вовсе — убираем пункт «Количество»
    const sl = el('span'), ln = el('i','lg-line'); sl.append(ln, document.createTextNode(LANG==='en'?'Number of members':'Количество членов Церкви')); lg.append(sl);
    const sp = el('span'), sw = el('i','lg-overbar'); sp.append(sw, document.createTextNode(LANG==='en'?'Above the number of members':'Сверх количества')); lg.append(sp); }
  host.append(lg);
}

/* мини-графики входящих подразделений: процент по кварталам и пунктир — среднее по этому уровню */
function multiples(n, draw){
  const kids = unitsOf(n), grid = el('div','multi');
  // одна шкала на все мини-графики: высота столбика сравнима между подразделениями
  const pc = s => s.map(([a,p])=>p>0?a/p:0);
  const shared = Math.max(0.05, ...kids.flatMap(c=>pc(c.m.att)), ...pc(n.m.att)) * 1.16;
  let lastGrp = null;
  kids.forEach((c,j)=>{
    if(c.parent!==n && c.parent!==lastGrp){ lastGrp = c.parent;
      const h = el('button','mgrp'); h.type='button'; h.append(el('span','gd-k', LANG==='en'?'District':'Округ'), document.createTextNode(nm(c.parent)+' →'));
      h.addEventListener('click',()=>{ go({node:c.parent.id}); window.scrollTo({top:0}); }); grid.append(h); }
    const b = el('button','mcard'); b.type = 'button';
    const col = kidColor(n, c, j);
    const tt = el('div','mt'); const d = el('i'); d.style.background = col;
    tt.append(d, el('span',null,nm(c)), el('span','mv',pct(val(c,'att',state.q)))); b.append(tt);
    const ch = el('div','chart'); b.append(ch); grid.append(b);
    b.setAttribute('aria-label', `${nm(c)}: ${pct(val(c,'att',state.q))}. ${loc('clickOpen')}`);
    draw.push(()=>barCard(ch, c, ['att'], {mini:true, parent:n, colors:[col], max:shared}));
    b.addEventListener('click', ()=>{ go({node:c.id}); window.scrollTo({top:0}); });
    b.addEventListener('pointerenter', ()=>window._stackHL && window._stackHL(j));
    b.addEventListener('pointerleave', ()=>window._stackHL && window._stackHL(null));
    b.addEventListener('focus', ()=>window._stackHL && window._stackHL(j));
    b.addEventListener('blur', ()=>window._stackHL && window._stackHL(null));
  });
  return grid;
}
function legendFor(n, keys){
  const lg = el('div','legend'), nk = keys.length;
  keys.forEach((k,j)=>{ const s = el('span'), sw = el('i'); sw.style.background = (nk>1?PAIR:['var(--s1)'])[j]; s.append(sw, document.createTextNode(nk>1 ? lbl(k,nk) : nm(n))); lg.append(s); });
  const par = parentOf(n);
  if(nk===1 && par && has(par,keys[0])){ const s = el('span'), ln = el('i','ln'); s.append(ln, document.createTextNode(`${loc('avgIn')} ${nm(par)}`)); lg.append(s); }
  return lg;
}

/* карточка целиком ведёт к сравнению подразделений по её показателю */
function toCompare(card, key){
  card.classList.add('cmp-link'); card.tabIndex = 0; card.setAttribute('role','link');
  const open = ()=>{ hideTip(); go({m:key}, true); document.getElementById('compare')?.scrollIntoView({behavior:'smooth',block:'start'}); };
  card.addEventListener('click', open);
  card.addEventListener('keydown', e=>{ if(e.key==='Enter' && e.target===card){ e.preventDefault(); open(); } });
}

/* приход: одна точка — один человек (у больших приходов — двое); закрашены те, кто пришёл */
function dotField(host, n){
  host.replaceChildren();
  const [a, p] = n.m.att[state.q] || [0,0];
  if(!p){ host.append(el('p','note',loc('nodata2'))); return; }
  // если пришло больше, чем членов Церкви по записям, лишние точки «переливаются через край» и выглядят иначе
  const per = Math.max(a,p) > 700 ? 2 : 1, P = Math.ceil(p/per), A = Math.round(a/per), N = Math.max(P, A);
  const W = Math.max(240, Math.floor(host.clientWidth)||300);
  // один значок — один человек: фигурка выше, чем шире (ячейка 0.7 × 1). Если фигурки выходят мельче 10 px — обычные точки.
  let pitch = 16, cols, rows, people = true;
  for(const pt of [30,28,26,24,22,20,18,16,15,14,13,12,11,10]){ pitch = pt; cols = Math.floor(W/(pt*0.7)); rows = Math.ceil(N/cols); if(rows*pt <= 440) break; }
  if(rows*pitch > 440){ people = false;
    for(const pt of [12,11,10,9,8,7,6]){ pitch = pt; cols = Math.floor(W/pt); rows = Math.ceil(N/cols); if(rows*pt <= 440) break; } }
  const cw = people ? pitch*0.7 : pitch, r = Math.max(2, pitch*0.36), H = rows*pitch;
  const svg = S('svg',{width:W,height:H,viewBox:`0 0 ${W} ${H}`,role:'img',class:'dots','aria-label':`${nf.format(a)} ${loc('of')} ${nf.format(p)}`});
  if(people){
    const sym = S('symbol',{id:'ppl',viewBox:'0 0 10 14'}, S('defs',{},svg));
    S('circle',{cx:5,cy:3.1,r:2.7},sym); S('path',{d:'M1.2 13.6V9.6a3.8 3.8 0 0 1 7.6 0v4z'},sym);
  }
  const step = Math.min(8, 1100/Math.max(1,A));
  for(let j=0;j<N;j++){
    const col = j%cols, row = Math.floor(j/cols);   // снизу вверх: пришедшие — внизу
    const cls = j < Math.min(A,P) ? 'dot-on' : j < P ? 'dot-off' : 'dot-over';
    let c;
    if(people){
      const w = cw*0.86, h = pitch*0.88;
      c = S('use',{href:'#ppl',x:(col*cw+(cw-w)/2).toFixed(1),y:(H-(row+1)*pitch+(pitch-h)/2).toFixed(1),width:w.toFixed(1),height:h.toFixed(1),class:cls},svg);
    } else {
      const cx = col*pitch + pitch/2, cy = H - (row*pitch + pitch/2);
      c = S('circle',{cx, cy, r: cls==='dot-over' ? r-0.75 : r, class: cls},svg);
    }
    if(cls!=='dot-off') c.style.setProperty('--d', (j*step).toFixed(0)+'ms');
  }
  host.append(svg);
  const lg = el('div','legend');
  const mk = (cls, txt) => { const s = el('span'), i = el('i'); i.className = cls + (people ? ' lg-ppl' : ''); s.append(i, document.createTextNode(txt)); lg.append(s); };
  const over = Math.max(0, a-p);
  if(over){
    mk('lg-on', LANG==='en' ? `members of record — ${nf.format(p)}` : `члены Церкви по записям — ${nf.format(p)}`);
    mk('lg-over', LANG==='en' ? `above the number of members — ${nf.format(over)}` : `сверх количества членов Церкви — ${nf.format(over)}`);
  } else {
    mk('lg-on', LANG==='en' ? `attended — ${nf.format(a)}` : `пришли — ${nf.format(a)}`);
    mk('lg-off', LANG==='en' ? `did not attend — ${nf.format(p-a)}` : `не пришли — ${nf.format(p-a)}`);
  }
  // заголовок карточки говорит, сколько людей в одном значке
  const h3 = host.closest('.card') && host.closest('.card').querySelector('h3');
  if(h3) h3.textContent = LANG==='en' ? `Each ${people?'figure':'dot'} is ${per>1?'2 people':'a person'}` : `${people?'Каждый значок':'Каждая точка'} — ${per>1?'2 человека':'человек'}`;
  host.append(lg);
  host.append(el('p','dots-cap', over
    ? (LANG==='en' ? `${qLabel(QN[state.q])}: ${nf.format(a)} people attended sacrament meeting with ${nf.format(p)} members of record — ${nf.format(over)} more (${pct(a/p)}).` : `${qLabel(QN[state.q])}: на причастное собрание пришли ${nf.format(a)} человек при ${nf.format(p)} членах Церкви по записям — на ${nf.format(over)} больше (${pct(a/p)}).`)
    : (LANG==='en' ? `${qLabel(QN[state.q])}: ${pct(a/p)} of ${nf.format(p)} members of record attended sacrament meeting.` : `${qLabel(QN[state.q])}: на причастное собрание пришли ${pct(a/p)} из ${nf.format(p)} членов Церкви по записям.`)));
}

/* ---------- отрисовка страницы ---------- */
const app = document.getElementById('app');
function render(){
  hideTip();
  const n = NODES[state.node], i = state.q, k = has(n,state.m) ? state.m : 'att';
  state.m = k;
  document.getElementById('q').value = i;
  applyStatic();
  const motion = !matchMedia('(prefers-reduced-motion: reduce)').matches;
  app.classList.toggle('ac', motion && (render._node !== state.node || render._lang !== LANG));
  render._node = state.node; render._lang = LANG;
  app.replaceChildren();
  const draw = []; window._stackHL = null;

  // путь и заголовок
  const path = []; for(let x=n; x && !x.stub; x=x.parent) path.unshift(x);
  const cr = el('nav','crumbs'); cr.setAttribute('aria-label', LANG==='en'?'Path':'Путь');
  path.forEach((x,j)=>{ if(j) cr.append(el('span','sep','›'));
    if(j<path.length-1){ const a = el('a',null,nm(x)); a.href='#'; a.addEventListener('click',e=>{e.preventDefault(); go({node:x.id});}); cr.append(a); }
    else cr.append(el('span','here',nm(x))); });
  app.append(cr);
  document.body.style.setProperty('--acc', accOf(n));
  const h1 = el('h1'); if(n.parent && !n.parent.stub){ const d = el('span','dotu'); d.style.background = accOf(n); h1.append(d); } h1.append(document.createTextNode(nm(n))); app.append(h1);
  const att = ap(n,'att',i), parts = [typeName(n)];
  if(n.children.length) parts.push(countKids(n));
  if(att && att[1]) parts.push(`${loc('totalMembers')} ${nf.format(att[1])}`);
  parts.push(qLabel(QN[i]));
  app.append(el('p','sub',parts.join(' · ')));
  const navRow = el('div','topnav');
  if(n.parent && !n.parent.stub){ const b = el('button','back','← '+loc('back')+': '+nm(n.parent)); b.addEventListener('click',()=>go({node:n.parent.id})); navRow.append(b); }
  // миссия: на графиках приходы округов показаны вперемешку, поэтому сами округа — кнопками сверху
  const dists = n.children.filter(c=>c.type==='округ' && !c.empty);
  if(dists.length){ dists.forEach(d=>{ const b = el('button','godist'); b.type='button';
      b.append(el('span','gd-k', LANG==='en'?'District':'Округ'), document.createTextNode(nm(d)+' →'));
      b.addEventListener('click',()=>{ go({node:d.id}); window.scrollTo({top:0}); }); navRow.append(b); }); }
  if(navRow.childNodes.length) app.append(navRow);
  const np = notesPanel(n); if(np) app.append(np);

  // блок 1: причастное собрание — как верх листа президентства
  const kids = kidsOf(n);
  const up = n.parent && !n.parent.stub ? n.parent : null;
  const sibs = !kids.length && up ? kidsOf(up) : [];   // приход: сравниваем с соседями
  const pool = kids.length ? kids : sibs;
  const s1 = el('section'); s1.append(el('h2',null,loc('attH')));
  const A = el('div','sheetA'), colL = el('div','col');
  const c1 = el('div','card'), hd1 = el('div','chead'); hd1.append(el('h3',null,loc('attPct'))); if(pool.length){ hd1.append(el('span','more',loc('compare')+' ›')); toCompare(c1,'att'); } c1.append(hd1, legendFor(n,['att'])); const h1c = el('div','chart'); c1.append(h1c); colL.append(c1);
  draw.push(()=>barCard(h1c, n, ['att'], {parent:parentOf(n), counts:false, label:loc('attPct')}));

function childTable(n){

  const mixed = new Set(n.children.map(c=>c.type)).size>1;
  const sortKey = childTable.sort?.node===n.id ? childTable.sort : {node:n.id, k:'att', dir:-1};
  const th0 = el('th', 'sortable'+(sortKey.k==='name'?' active':''), loc('unit')); th0.addEventListener('click',()=>{ childTable.sort={node:n.id,k:'name',dir: sortKey.k==='name'?-sortKey.dir:1}; render(); });
  hr.append(th0);

    const th = el('th','sortable'+(sortKey.k===k?' active':''), M[k].short + (sortKey.k===k?(sortKey.dir<0?' ↓':' ↑'):''));

  const tb = el('tbody');
  const rows = n.children.slice().sort((a,b)=>{
    if(mixed && a.type!==b.type) return TYPE_ORDER[a.type]-TYPE_ORDER[b.type];
    if(a.empty!==b.empty) return a.empty?1:-1;
    if(sortKey.k==='name') return sortKey.dir*nm(a).localeCompare(nm(b),LANG);
    const va = val(a,sortKey.k,i), vb = val(b,sortKey.k,i);
    if(va==null&&vb==null) return 0; if(va==null) return 1; if(vb==null) return -1;
    return sortKey.dir*(va-vb);
  });
  const mk = (x, total) => {
    const tr = el('tr', total?'total':'row');
    const td0 = el('td');

    if(!total && !n.parent){ const d = el('span','dot'); d.style.background = accOf(x); rn.prepend(d); }

    tr.append(td0);

      const v = val(x,k,i), a = ap(x,k,i);
      const td = el('td', v==null?'na':'');
      if(v==null){ td.textContent='—'; }
      else {
        td.append(document.createTextNode(pct(v)));
        const over = v>1 && !isMinorOver(a[0],a[1]);
        if(over || denomJump(x,k,i,i-1)!=null){ const w=el('span','w','⚠'); w.title = over?'больше 100%':`резко изменилось ${qty(k)}`; td.append(w); }
        td.append(el('span','ap',`${a[0]} ${LANG==='en'?'of':'из'} ${a[1]}`));
        const b = el('span','cellbar'); b.style.width = Math.min(100,v*100)*0.6+'px'; if(a[1]<SMALL) b.style.opacity=.3; td.append(b);
      }
      tr.append(td);
    });
    if(!total){
      tr.tabIndex = 0;
      const open = ()=>{ go({node:x.id}); window.scrollTo({top:0}); };
      tr.addEventListener('click', open);
      tr.addEventListener('keydown', e=>{ if(e.key==='Enter'){ open(); } });
    }
    return tr;
  };
  let lastType = null;
  rows.forEach(x=>{
    if(mixed && x.type!==lastType){

      td.colSpan = keys.length+1; gr.append(td); tb.append(gr);

  });
  tb.append(mk(n,true));
  t.append(tb); wrap.append(t);

}

  // насколько далеко от среднего бывает подразделение по этому показателю — для силы цвета

  keys.forEach(k=>{ avg[k] = val(n,k,i); const ds = rows.map(c=>{ const a = ap(c,k,i); return a && a[1]>=SMALL && avg[k]!=null ? Math.abs(a[0]/a[1]-avg[k]) : null; }).filter(v=>v!=null); spread[k] = Math.max(0.03, ...ds); });
  const body2 = el('tbody');

    const td0 = el('td'); if(!tot && !n.parent){ const d = el('span','dot'); d.style.background = accOf(x); td0.append(d); }
    td0.append(document.createTextNode(tot ? `${cap(loc('hmAvg'))}: ${nm(n)}` : nm(x))); tr.append(td0);

      else if(a[1]<SMALL){ td.className = 'sm'; td.textContent = pct(v); }
      else {
        const d = avg[k]==null ? 0 : v-avg[k];
        td.textContent = pct(v);
        if(Math.abs(d) >= 0.01){
          const f = Math.min(1, Math.abs(d)/spread[k]), mix = Math.round(14 + 70*f);
          td.style.background = `color-mix(in srgb, var(${d<0?'--hm-lo':'--hm-hi'}) ${mix}%, var(--surface))`;
          if(mix >= 52) td.classList.add('hi');

        tp.append(el('div','tt', `${tot?nm(n):nm(x)} · ${M[k].short}`));
        tipRow(tp, 'var(--s1)', v==null?'—':pct(v), qLabel(QN[i]), a&&a[1]>0?`${nf.format(a[0])} ${loc('of')} ${nf.format(a[1])} ${baseOf(k)}`:loc('nodata2'));

      }));
      td.addEventListener('pointerleave', hideTip);

    return tr;
  };
  rows.forEach((x,r)=>body2.append(mk(x,r,false)));

  tb.append(body2); body.append(tb);
  body.append(el('p','hm-note',loc('hmNote')));
}

function cleanNode(n){ return {id:n.id, name:n.name, en:n.en, type:n.type, m:n.m, empty:n.empty, children:n.children.map(cleanNode)}; }

function buildScoped(u){
  const ids = new Set(subtree(u).map(x=>x.id));
  const parent = u.parent;   // среднее уровнем выше: для кола и миссии — регион, для округа — миссия
  const stub = {id:'__parent', name:parent.name, en:parent.en, type:parent.type, m:parent.m, stub:true, empty:false, children:[cleanNode(u)]};
  let top = u; while(top.parent && top.parent.parent) top = top.parent;
  const baked = {}, bakedCl = {}, keep = state.q;
  QN.forEach((q,i)=>{
    state.q = i;
    baked[q] = issuesFor(u).map(x=>{ const o = Object.assign({}, x); o.node = x.node.id; return o; });
    const cl = {}; if(i>0) subtree(u).forEach(x=>{ const v = cleanupNote(x,i); if(v) cl[x.id] = v; });
    bakedCl[q] = cl;
  });
  state.q = keep;
  return Object.assign({}, DATA, {
    tree: stub,
    excelFlags: DATA.excelFlags.filter(f=>ids.has(f.node)),
    notes: (DATA.notes||[]).filter(x=>ids.has(x.node)),        // только пояснения по этому подразделению и его приходам
    scope: {unit:u.id, slot: UNIT_SLOT.get(top)},
    baked, bakedCl,
  });
}
function scopedHTML(u){
  const tpl = new TextDecoder().decode(Uint8Array.from(atob(TPL_B64), c=>c.charCodeAt(0)));
  const data = JSON.stringify(buildScoped(u)).replace(/</g,'\\u003c');
  return tpl.replace('/*__DATA__*/null', ()=>data).replace('/*__TPL__*/""', '""');
}
/* минимальный zip без сжатия (store) — работает без интернета и без библиотек */
const CRC_T = (()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0; } return t; })();
function crc32(b){ let c=0xFFFFFFFF; for(let i=0;i<b.length;i++) c = CRC_T[(c^b[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function makeZip(files){
  const enc = new TextEncoder(), parts = [], central = []; let off = 0;
  const d = new Date(), dt = ((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1)), dd = (((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate());
  files.forEach(f=>{
    const name = enc.encode(f.name), data = enc.encode(f.text), crc = crc32(data);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint16(6,0x0800,true); h.setUint16(8,0,true);
    h.setUint16(10,dt,true); h.setUint16(12,dd,true); h.setUint32(14,crc,true); h.setUint32(18,data.length,true); h.setUint32(22,data.length,true);
    h.setUint16(26,name.length,true); h.setUint16(28,0,true);
    parts.push(new Uint8Array(h.buffer), name, data);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true); c.setUint16(4,20,true); c.setUint16(6,20,true); c.setUint16(8,0x0800,true); c.setUint16(10,0,true);
    c.setUint16(12,dt,true); c.setUint16(14,dd,true); c.setUint32(16,crc,true); c.setUint32(20,data.length,true); c.setUint32(24,data.length,true);
    c.setUint16(28,name.length,true); c.setUint32(42,off,true);
    central.push(new Uint8Array(c.buffer), name);
    off += 30 + name.length + data.length;
  });
  const csize = central.reduce((s,a)=>s+a.length,0);
  const e = new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true); e.setUint16(8,files.length,true); e.setUint16(10,files.length,true); e.setUint32(12,csize,true); e.setUint32(16,off,true);
  return new Blob([...parts, ...central, new Uint8Array(e.buffer)], {type:'application/zip'});
}
const safeName = s => s.replace(/[\\/:*?"<>|]+/g,' ').replace(/\s+/g,' ').trim();
async function doExport(){
  const btn = document.getElementById('export'); btn.disabled = true; const old = btn.textContent; btn.textContent = 'Готовлю…';
  await new Promise(r=>setTimeout(r,30));
  try{
    const files = exportTargets().map(u=>({name:`${safeName(u.name)}.html`, text:scopedHTML(u)}));
    const a = document.createElement('a'); a.href = URL.createObjectURL(makeZip(files));
    a.download = `Отчёты_${qLabel(QN[QN.length-1]).replace(/[ .]+/g,'_')}.zip`;
    document.body.append(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  } finally { btn.disabled = false; btn.textContent = old; }
}

// Блок 1 — замечания к данным за выбранный квартал: какие уже объяснены пояснением, какие нет.
// Блок 2 — ошибки в самой таблице Excel (формулы, итоги, пустые подразделения, строки листа «Пояснения»).
function noteFor(iss){
  // пояснение подходит, если оно к этому подразделению (или к его колу/миссии/округу — но не ко всему региону),
  // за этот квартал или без квартала, и показатель не указан либо совпадает
  // пояснение без показателя у вышестоящего подразделения не закрывает замечания по конкретным показателям у прихода
  const q = QN[state.q], fits = (x, self) => (x.q===q || !x.q) && (x.metric ? (!iss.k || x.metric===iss.k) : (self || !iss.k));
  for(let u = iss.node; u && u.parent; u = u.parent){
    const hit = NOTES.find(x=>x.node===u.id && fits(x, u===iss.node));
    if(hit) return {note:hit, at:u};
  }
  return null;
}
function reportLink(node){
  const a = el('a', null, nm(node));
  a.href = (DATA.reportFile||'Eurasian_Area_Report.html') + `#n=${encodeURIComponent(node.id)}&q=${QN[state.q]}&m=att&l=ru`;
  a.target = '_blank'; a.rel = 'noopener';
  return a;
}
function unitHead(node){
  const h = el('div','issue-unit'); h.append(reportLink(node));
  const up = []; for(let x=node.parent; x && x.parent; x=x.parent) up.push(nm(x));
  if(up.length) h.append(document.createTextNode(' · ' + up.join(' · ')));
  return h;
}
// сухая таблица «было → стало»; текст — только у причастного собрания (там он объясняет причину)
const DRY = new Set(['>100%','Не сдали','Количество 0','Не заполняют']);
function apCell(v){
  const td = el('td','num');
  if(!v){ td.textContent = '—'; return td; }
  const [a,p] = v;
  td.append(el('b',null, p>0 ? pct(a/p) : '—'), el('span','ap', ` ${nf.format(a)} из ${nf.format(p)}`));
  return td;
}
function issueTable(items, withNote){
  const i = state.q, order = new Map(subtree(NODES.area).map((x,j)=>[x,j]));
  const wrap = el('div','tblwrap'), tb = el('table','chk-tbl');
  const hr = el('tr');
  ['Подразделение','Показатель','Замечание', i>0 ? `Было · ${qLabel(QN[i-1])}` : 'Было', `Стало · ${qLabel(QN[i])}`].concat(withNote?['Пояснение']:[])
    .forEach((h,j)=>hr.append(el('th', j>=3&&j<=4?'num':null, h)));
  const th = el('thead'); th.append(hr); tb.append(th);
  const body = el('tbody');
  items.slice().sort((a,b)=>order.get(a.node)-order.get(b.node) || String(a.k||'att').localeCompare(String(b.k||'att'))).forEach(x=>{
    const k = x.k || 'att', s = x.node.m[k], tr = el('tr');
    const tu = el('td','unit'); tu.append(reportLink(x.node));
    if(x.node.parent && x.node.parent.parent) tu.append(el('div','up', nm(x.node.parent)));
    tr.append(tu, el('td',null, M[k] ? M[k].short : ''));
    const tk = el('td','kd'); tk.append(el('span','kind '+x.cls, x.kind));
    if(k==='att' && !DRY.has(x.kind)) tk.append(el('div','why', x.text));
    tr.append(tk, apCell(s && i>0 ? s[i-1] : null), apCell(s ? s[i] : null));
    if(withNote){
      const tn = el('td','nt');
      if(x.nf){ if(x.nf.at!==x.node) tn.append(el('b',null,'у «'+nm(x.nf.at)+'»: ')); tn.append(document.createTextNode(x.nf.note.text)); }
      tr.append(tn);
    }
    body.append(tr);
  });
  tb.append(body); wrap.append(tb); return wrap;
}
function block(title, cls, count, note){
  const s = el('section','chk-b '+cls);
  const h = el('h2'); h.append(document.createTextNode(title+' ')); h.append(el('span','chk-n', String(count))); s.append(h);
  if(note) s.append(el('p','note',note));
  return s;
}
function renderCheck(){
  hideTip();
  const i = state.q, area = NODES.area;
  document.getElementById('q').value = i;
  applyStatic();
  app.classList.remove('ac'); app.replaceChildren();
  app.append(el('h1',null,'Проверка данных'));
  app.append(el('p','sub', `${qLabel(QN[i])} · файл для себя, не для рассылки · источник: ${DATA.source}`));

  // ---- блок 1: замечания к данным за квартал
  const all = issuesFor(area, true).filter(x=>!x.excelGroup && x.kind!=='Пусто');   // пустые подразделения — во втором блоке
  // «Посещаемость» не дублируем, если по причастию у подразделения уже есть замечание о количестве (оно объясняет и посещаемость)
  const attOther = new Set(all.filter(x=>(x.k||'att')==='att' && ['Количество','Аудит карточек?','Перевод?','Закрыт?'].includes(x.kind)).map(x=>x.node));
  const main = all.filter(x=>!x.minor && !(x.kind==='Посещаемость' && attOther.has(x.node))), minor = all.filter(x=>x.minor);
  main.forEach(x=>{ x.nf = noteFor(x); });
  const open = main.filter(x=>!x.nf), done = main.filter(x=>x.nf);
  const used = new Set(done.map(x=>x.nf.note));
  const loose = NOTES.filter(x=>x.q===QN[i] && !used.has(x));

  // ---- блок 2: ошибки в таблице (за все кварталы)
  const xl = (DATA.excelFlags||[]), np = (DATA.noteProblems||[]);
  const xlGroups = {};
  xl.forEach(f=>{
    const key = f.kind+'|'+f.sheet+'|'+f.node+'|'+f.metric;
    (xlGroups[key] ||= {f, qs:[], cells:[]}).qs.push(f.q);
    if(f.cell) xlGroups[key].cells.push(f.cell);
    xlGroups[key].last = f.text;
  });
  const xlList = Object.values(xlGroups), xlCount = xlList.length + np.length;

  // сводка
  const sum = el('div','chk-sum');
  const tile = (n, label, cls) => { const d = el('div','chk-t '+cls); d.append(el('b',null,String(n)), el('span',null,label)); return d; };
  sum.append(tile(open.length, 'без пояснения', open.length?'bad':'ok'), tile(done.length, 'объяснены', 'ok'), tile(xlCount, 'ошибок в таблице', xlCount?'bad':'ok'));
  app.append(sum);

  const b1 = block('Замечания к данным', 'b1', main.length,
    `То, что скрипт заметил в цифрах за ${qLabel(QN[i])}. Сначала — без пояснения: их стоит объяснить на листе «Пояснения» или исправить в таблице. Название подразделения открывает его в отчёте.`);
  if(!main.length) b1.append(el('p','chk-empty','Замечаний за этот квартал нет.'));
  // сначала — причастное собрание отдельным блоком, потом остальные показатели по подразделениям
  const isAtt = x => (x.k||'att')==='att';
  [['Причастное собрание', isAtt, 'chk-sec att'], ['Другие показатели', x=>!isAtt(x), 'chk-sec']].forEach(([title, f, cls])=>{
    const o = open.filter(f), d = done.filter(f); if(!o.length && !d.length) return;
    const sec = el('div', cls); sec.append(el('h3','chk-sh', `${title} · ${o.length+d.length}`));
    if(o.length) sec.append(el('h4','chk-h bad', `Без пояснения · ${o.length}`), issueTable(o, false));
    if(d.length) sec.append(el('h4','chk-h ok', `С пояснением · ${d.length}`), issueTable(d, true));
    b1.append(sec);
  });
  if(loose.length){
    const d = document.createElement('details'); d.className='sub';
    const s = el('summary',null,'Пояснения за этот квартал, к которым скрипт ничего не нашёл'); s.append(el('span','cnt',String(loose.length))); d.append(s);
    const b = el('div','dbody'); b.append(el('p','note','Это нормально: пояснение может описывать то, чего по цифрам не видно. Здесь они для сверки.'));
    loose.forEach(x=>{ const node = NODES[x.node]; if(!node) return; b.append(unitHead(node)); const r = el('div','issue'); r.append(el('span','kind k-ok','Пояснение')); const t = el('span'); if(x.metric && M[x.metric]) t.append(el('b',null,M[x.metric].short+': ')); t.append(document.createTextNode(x.text)); r.append(t); b.append(r); });
    d.append(b); b1.append(d);
  }
  if(minor.length){
    const d = document.createElement('details'); d.className='sub';
    const s = el('summary',null,'Мелкие отклонения'); s.append(el('span','cnt',String(minor.length))); d.append(s);
    const b = el('div','dbody'); b.append(el('p','note',`Посещаемость больше количества не более чем на 2 человека или 10%, либо группа меньше ${SMALL} человек. Объяснять не обязательно.`));
    b.append(issueTable(minor, false)); d.append(b); b1.append(d);
  }
  app.append(b1);

  const b2 = block('Ошибки в таблице', 'b2', xlCount,
    'Ошибки в самом Excel-файле, за все кварталы отчёта. В отчёте цифры пересчитаны правильно, но в PDF из Excel попадёт неверное значение — лучше исправить в книге.');
  if(!xlCount) b2.append(el('p','chk-empty','Ошибок нет.'));
  const KIND = {formula:['Формула','Процент в ячейке не равен «пришли / всего». Чаще всего формулу затёрли числом. Вернуть формулу вида =ЕСЛИОШИБКА(B23/C23;"").'],
                total:['Итог листа','Итог на листе не равен сумме подразделений.'],
                empty:['Пустое подразделение','Все показатели нулевые во всех кварталах: подразделение не сдаёт данные, или его нет и столбец можно убрать.']};
  Object.keys(KIND).forEach(kind=>{
    const arr = xlList.filter(x=>x.f.kind===kind); if(!arr.length) return;
    b2.append(el('h3','chk-h', `${KIND[kind][0]} · ${arr.length}`), el('p','note',KIND[kind][1]));
    const box = el('div','chk-list');
    arr.forEach(x=>{
      const f = x.f, node = NODES[f.node];
      const r = el('div','issue');
      r.append(el('span','kind k-mute', f.sheet ? `лист «${f.sheet}»` : 'книга'));
      const s = el('span');
      if(node) s.append(el('b',null, nm(node) + (f.metric && M[f.metric] ? ', '+M[f.metric].short : '') + ': '));
      const when = !f.q ? '' : x.qs.length===QN.length ? 'во всех кварталах' : x.qs.map(qLabel).join(', ');
      s.append(document.createTextNode([when, x.cells.length ? 'ячейки '+x.cells.join(', ') : '', f.kind==='empty' ? 'все показатели нулевые во всех кварталах' : 'пример: '+x.last].filter(Boolean).join(' · ')));
      r.append(s); box.append(r);
    });
    b2.append(box);
  });
  if(np.length){
    b2.append(el('h3','chk-h', `Лист «Пояснения» · ${np.length}`), el('p','note','Эти строки не попали в отчёт.'));
    const box = el('div','chk-list'); np.forEach(t=>{ const r = el('div','issue'); r.append(el('span','kind k-warn','Пояснение'), el('span',null,t)); box.append(r); }); b2.append(box);
  }
  app.append(b2);
}

/* ---------- запуск ---------- */
const qs = document.getElementById('q');
QN.forEach((q,j)=>{ const o = document.createElement('option'); o.value = j; o.textContent = qLabel(q); qs.append(o); });
qs.addEventListener('change',()=>go({q:+qs.value}, true));
document.querySelectorAll('#lang button').forEach(b=>b.addEventListener('click',()=>{ if(b.dataset.l===LANG) return; setLang(b.dataset.l); go({}, true); }));
document.getElementById('theme').addEventListener('click',()=>{
  const r = document.documentElement;
  const dark = r.dataset.theme ? r.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme = dark ? 'light' : 'dark';
});
let rt, lastW = innerWidth; addEventListener('resize',()=>{ if(innerWidth===lastW) return; lastW = innerWidth; clearTimeout(rt); rt = setTimeout(render,150); });
if(TPL_B64 && !SCOPE){ const b = document.getElementById('export'); b.hidden = false; b.addEventListener('click', doExport); }
if(DATA.logo && DATA.logo.small){ const h = document.getElementById('hlogo'); h.src = DATA.logo.small; h.classList.add('on'); }
addEventListener('beforeprint', ()=>{ app.classList.remove('ac'); });
try{ const l = localStorage.getItem('stat-lang'); if(l) LANG = l; }catch(e){}
if(DATA.mode==='check'){            // файл «Проверка данных»: только по-русски, без выгрузки
  render = renderCheck; LANG = 'ru';
  ['lang','export','hmap'].forEach(id=>{ const e = document.getElementById(id); if(e) e.style.display = 'none'; });
  document.title = 'Проверка данных';
}
// плавающая кнопка «наверх»: появляется, когда страница прокручена ниже первого экрана
const toTop = document.createElement('button'); toTop.id = 'totop'; toTop.type = 'button';
toTop.innerHTML = '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
toTop.addEventListener('click', ()=>window.scrollTo({top:0, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'}));
document.body.append(toTop);
const syncTop = ()=>{ toTop.classList.toggle('on', scrollY > innerHeight*0.8); toTop.setAttribute('aria-label', LANG==='en'?'Back to top':'Наверх'); toTop.title = toTop.getAttribute('aria-label'); };
addEventListener('scroll', syncTop, {passive:true}); addEventListener('hashchange', syncTop);
readHash(); if(DATA.mode==='check') LANG = 'ru'; setLang(LANG); render();
</script>
</body>
